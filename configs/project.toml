[project]
name = "Lara-LTX-2.5-MLX-BF16"
quality_mode = "quality-preserve"
dtype = "bfloat16"
quantization = "none"

[upstream.source]
repository_url = "https://github.com/Lightricks/LTX-2.git"
commit = "400fd31054597515f47125691032c04b1c3ee24e"

[upstream.model]
repository_id = "Lightricks/LTX-2.5"
revision = "6c7e5e573ac1667efc83407806fe9b0b93730e60"
minimum_free_bytes_after_download = 107374182400
download_worker_count = 2

[runtime]
